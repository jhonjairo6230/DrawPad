# Compila DrawPad en un Mac de GitHub y publica un .ipa SIN firmar.
# Explicación paso a paso: docs/compilacion-e-instalacion.md
#
# Dos trabajos en paralelo:
#   - ipa:   compila y publica el .ipa (unos 3 minutos).
#   - tests: pruebas unitarias y de interfaz en un simulador (unos 25 minutos).
# El .ipa no espera a las pruebas: se puede instalar y probar en el iPad
# mientras terminan (ver docs/adr/0014-ipa-y-pruebas-en-paralelo.md).
name: Compilar IPA

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "release/**"
      - "hotfix/**"
      - "backport/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ipa:
    name: IPA
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Versión de Xcode
        run: xcodebuild -version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar DrawPad.xcodeproj
        run: xcodegen generate

      - name: Compilar para iPad (sin firmar)
        run: |
          xcodebuild build \
            -project DrawPad.xcodeproj \
            -scheme DrawPad \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Empaquetar .ipa
        run: |
          # Un .ipa es un .zip con la app dentro de una carpeta "Payload".
          mkdir -p build/ipa/Payload
          cp -R build/device/Build/Products/Release-iphoneos/DrawPad.app build/ipa/Payload/
          cd build/ipa
          zip -qry DrawPad-unsigned.ipa Payload
          ls -lh DrawPad-unsigned.ipa

      - name: Publicar .ipa
        uses: actions/upload-artifact@v4
        with:
          name: DrawPad-ipa
          path: build/ipa/DrawPad-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  tests:
    name: Pruebas
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar DrawPad.xcodeproj
        run: xcodegen generate

      - name: Pruebas unitarias y de interfaz (simulador de iPad)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 scripts/pick_ipad_simulator.py)
          echo "Simulador: $UDID"
          # Arrancarlo y esperar a que esté listo: si la primera prueba de
          # interfaz lo pilla arrancando, falla al lanzar la app.
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild test \
            -project DrawPad.xcodeproj \
            -scheme DrawPad \
            -destination "id=$UDID" \
            -derivedDataPath build/tests \
            CODE_SIGNING_ALLOWED=NO

      - name: Informes de cierre de la app (si las pruebas fallan)
        if: failure()
        run: |
          # Si la app se cerró sola, macOS deja aquí el motivo y la pila de llamadas.
          shopt -s nullglob
          for report in ~/Library/Logs/DiagnosticReports/DrawPad*.ips; do
            echo "::group::$report"
            head -c 20000 "$report"
            echo "::endgroup::"
          done
