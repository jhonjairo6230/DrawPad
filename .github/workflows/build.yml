# Compila DrawPad en un Mac de GitHub y publica un .ipa SIN firmar.
# Explicación paso a paso: docs/compilacion-e-instalacion.md
name: Compilar IPA

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "release/**"
      - "hotfix/**"
      - "backport/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Pruebas e IPA
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Versión de Xcode
        run: xcodebuild -version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar DrawPad.xcodeproj
        run: xcodegen generate

      - name: Pruebas unitarias (simulador de iPad)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 scripts/pick_ipad_simulator.py)
          echo "Simulador: $UDID"
          xcodebuild test \
            -project DrawPad.xcodeproj \
            -scheme DrawPad \
            -destination "id=$UDID" \
            -derivedDataPath build/tests \
            CODE_SIGNING_ALLOWED=NO

      - name: Compilar para iPad (sin firmar)
        run: |
          xcodebuild build \
            -project DrawPad.xcodeproj \
            -scheme DrawPad \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Empaquetar .ipa
        run: |
          # Un .ipa es un .zip con la app dentro de una carpeta "Payload".
          mkdir -p build/ipa/Payload
          cp -R build/device/Build/Products/Release-iphoneos/DrawPad.app build/ipa/Payload/
          cd build/ipa
          zip -qry DrawPad-unsigned.ipa Payload
          ls -lh DrawPad-unsigned.ipa

      - name: Publicar .ipa
        uses: actions/upload-artifact@v4
        with:
          name: DrawPad-ipa
          path: build/ipa/DrawPad-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
