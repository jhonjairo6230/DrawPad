# Definición del proyecto para XcodeGen.
# El .xcodeproj NO se guarda en git: se genera con `xcodegen generate`
# (en el CI de GitHub o en un Mac). Ver docs/adr/0004-compilar-sin-mac.md.
name: DrawPad

options:
  bundleIdPrefix: com.jhonjairo6230
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  DrawPad:
    type: application
    platform: iOS
    sources:
      - path: DrawPad
    info:
      path: DrawPad/Resources/Info.plist
      properties:
        CFBundleDisplayName: DrawPad
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryAddUsageDescription: DrawPad necesita permiso para guardar tus dibujos en Fotos.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jhonjairo6230.drawpad
        TARGETED_DEVICE_FAMILY: "2" # Solo iPad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  DrawPadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DrawPadTests
    dependencies:
      - target: DrawPad
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"

schemes:
  DrawPad:
    build:
      targets:
        DrawPad: all
        DrawPadTests: [test]
    test:
      config: Debug
      targets:
        - DrawPadTests
