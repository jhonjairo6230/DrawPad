# Definición del proyecto para XcodeGen.
# El .xcodeproj NO se guarda en git: se genera con `xcodegen generate`
# (en el CI de GitHub o en un Mac). Ver docs/adr/0004-compilar-sin-mac.md.
name: DrawPad

options:
  bundleIdPrefix: com.jhonjairo6230
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  DrawPad:
    type: application
    platform: iOS
    sources:
      - path: DrawPad
    info:
      path: DrawPad/Resources/Info.plist
      properties:
        CFBundleDisplayName: DrawPad
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        # iPhone: solo lectura (ver docs/adr/0018).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryAddUsageDescription: DrawPad necesita permiso para guardar tus dibujos en Fotos.
        # Archivos .drawpad: cuadernos exportados (ver docs/adr/0017).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.jhonjairo6230.drawpad.notebook
            UTTypeDescription: Cuaderno de DrawPad
            UTTypeConformsTo:
              - public.data
              - public.content
            UTTypeTagSpecification:
              public.filename-extension:
                - drawpad
        CFBundleDocumentTypes:
          - CFBundleTypeName: Cuaderno de DrawPad
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.jhonjairo6230.drawpad.notebook
        # iOS copia el archivo a la app al abrirlo desde Archivos, en lugar de
        # editarlo donde está.
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jhonjairo6230.drawpad
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone (solo lectura) y iPad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  DrawPadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DrawPadTests
    dependencies:
      - target: DrawPad
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  DrawPadUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DrawPadUITests
    dependencies:
      - target: DrawPad
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  DrawPad:
    build:
      targets:
        DrawPad: all
        DrawPadTests: [test]
        DrawPadUITests: [test]
    test:
      config: Debug
      targets:
        - DrawPadTests
        - DrawPadUITests
